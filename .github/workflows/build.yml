name: automation-ir validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public progress export (six regression tests)
        run: python -B -m unittest discover -s scripts -p test_export_progress_status.py -v
      - run: npm ci
      - name: Read audited consumer revision
        id: consumer
        run: node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync("reports/progress/runtime-coverage.json"));if(!/^[a-f0-9]{40}$/.test(r.consumer.revision))throw Error("Invalid consumer revision");fs.appendFileSync(process.env.GITHUB_OUTPUT,"revision="+r.consumer.revision+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: FullPeople/DND-card-web
          ref: ${{ steps.consumer.outputs.revision }}
          path: .cache/web-consumer
          persist-credentials: false
      - name: Verify audited consumer revision and actual module bytes
        run: node --experimental-strip-types scripts/verify_runtime_consumer.ts .cache/web-consumer
      - name: Test coverage against real pinned consumer functions
        run: node --experimental-strip-types scripts/test_runtime_probe.ts .cache/web-consumer
      - run: npm test
      - run: npm run build
  pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch, derive, apply reviewed overlays, validate and report
        run: npm run pipeline
      - run: npm run validate -- --file artifacts/automation.json
      - uses: actions/upload-artifact@v4
        with:
          name: automation-ir-${{ github.sha }}
          path: |
            artifacts/automation.json
            artifacts/coverage-report.json
            artifacts/coverage-report.md
            artifacts/unsupported.json
            artifacts/diff-report.md
            artifacts/inputs-sha256.json
          if-no-files-found: error
