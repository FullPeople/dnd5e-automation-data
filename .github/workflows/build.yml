name: automation-ir validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public progress export (six regression tests)
        run: python -B -m unittest discover -s scripts -p test_export_progress_status.py -v
      - run: npm ci
      - name: Read audited consumer revision
        id: consumer
        run: node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync("reports/progress/runtime-coverage.json"));if(!/^[a-f0-9]{40}$/.test(r.consumer.revision))throw Error("Invalid consumer revision");fs.appendFileSync(process.env.GITHUB_OUTPUT,"revision="+r.consumer.revision+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: FullPeople/DND-card-web
          ref: ${{ steps.consumer.outputs.revision }}
          path: .cache/web-consumer
          persist-credentials: false
      - name: Verify audited consumer revision and actual module bytes
        run: node --experimental-strip-types scripts/verify_runtime_consumer.ts .cache/web-consumer
      - name: Test coverage against real pinned consumer functions
        run: node --experimental-strip-types scripts/test_runtime_probe.ts .cache/web-consumer
      - name: Install locked audited consumer dependencies for full persistence imports
        run: npm ci --prefix .cache/web-consumer
      - name: Replay explicit ASI workflows against the audited consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/asi-inputs
          for path in class/class-fighter.json class/class-artificer.json feats.json; do
            revision=e2623b204ddbdf2bcfa8317acfc962de89c676e2
            if [ "$path" = feats.json ]; then revision=5cc0bbe2c2b241a334e731af4448bdba2168e8bd; fi
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 3000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/$path" \
              --output ".cache/asi-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['class/class-fighter.json','class/class-artificer.json','feats.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/asi-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/asi-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_asi_workflow.ts .cache/web-consumer .cache/asi-inputs .cache/asi-workflow.json
      - name: Replay three explicit attuned TCE infusion workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/attuned-inputs
          for path in class/class-artificer.json optionalfeatures.json items-base.json; do
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 3000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/e2623b204ddbdf2bcfa8317acfc962de89c676e2/data/$path" \
              --output ".cache/attuned-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['class/class-artificer.json','optionalfeatures.json','items-base.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/attuned-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/attuned-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_attuned_infusions.ts .cache/web-consumer .cache/attuned-inputs .cache/attuned-workflow.json
      - name: Replay three reviewed PHB invocation spell workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/invocation-inputs
          for path in optionalfeatures.json class/class-warlock.json spells/spells-phb.json; do
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 3000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/e2623b204ddbdf2bcfa8317acfc962de89c676e2/data/$path" \
              --output ".cache/invocation-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['optionalfeatures.json','class/class-warlock.json','spells/spells-phb.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/invocation-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/invocation-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_invocation_spells.ts .cache/web-consumer .cache/invocation-inputs .cache/invocation-spells.json
      - name: Replay three reviewed level-9 PHB invocation workflows
        run: node --experimental-strip-types scripts/audit_invocation_level9.ts .cache/web-consumer .cache/invocation-inputs .cache/invocation-level9.json
      - run: npm test
      - run: npm run build
  pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch, derive, apply reviewed overlays, validate and report
        run: npm run pipeline
      - run: npm run validate -- --file artifacts/automation.json
      - uses: actions/upload-artifact@v4
        with:
          name: automation-ir-${{ github.sha }}
          path: |
            artifacts/automation.json
            artifacts/coverage-report.json
            artifacts/coverage-report.md
            artifacts/unsupported.json
            artifacts/diff-report.md
            artifacts/inputs-sha256.json
          if-no-files-found: error
