name: automation-ir validation
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * 1'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public progress export (six regression tests)
        run: python -B -m unittest discover -s scripts -p test_export_progress_status.py -v
      - run: npm ci
      - name: Read audited consumer revision
        id: consumer
        run: node -e 'const fs=require("fs"),r=JSON.parse(fs.readFileSync("reports/progress/runtime-coverage.json"));if(!/^[a-f0-9]{40}$/.test(r.consumer.revision))throw Error("Invalid consumer revision");fs.appendFileSync(process.env.GITHUB_OUTPUT,"revision="+r.consumer.revision+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: FullPeople/DND-card-web
          ref: ${{ steps.consumer.outputs.revision }}
          path: .cache/web-consumer
          persist-credentials: false
      - name: Verify audited consumer revision and actual module bytes
        run: node --experimental-strip-types scripts/verify_runtime_consumer.ts .cache/web-consumer
      - name: Test coverage against real pinned consumer functions
        run: node --experimental-strip-types scripts/test_runtime_probe.ts .cache/web-consumer
      - name: Install locked audited consumer dependencies for full persistence imports
        run: npm ci --prefix .cache/web-consumer
      - name: Replay explicit ASI workflows against the audited consumer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/asi-inputs
          for path in class/class-fighter.json class/class-artificer.json feats.json; do
            revision=e2623b204ddbdf2bcfa8317acfc962de89c676e2
            if [ "$path" = feats.json ]; then revision=5cc0bbe2c2b241a334e731af4448bdba2168e8bd; fi
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 3000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/$path" \
              --output ".cache/asi-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['class/class-fighter.json','class/class-artificer.json','feats.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/asi-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/asi-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_asi_workflow.ts .cache/web-consumer .cache/asi-inputs .cache/asi-workflow.json
      - name: Replay exact reviewed PHB2014 passive feat workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/passive-feat-inputs
          for path in class/class-artificer.json class/class-barbarian.json class/class-bard.json class/class-cleric.json class/class-druid.json class/class-fighter.json class/class-monk.json class/class-paladin.json class/class-ranger.json class/class-rogue.json class/class-sorcerer.json class/class-warlock.json class/class-wizard.json feats.json variantrules.json items-base.json items.json magicvariants.json; do
            revision=e2623b204ddbdf2bcfa8317acfc962de89c676e2
            if [[ "$path" = feats.json || "$path" = items.json || "$path" = magicvariants.json ]]; then revision=5cc0bbe2c2b241a334e731af4448bdba2168e8bd; fi
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 3000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/$path" \
              --output ".cache/passive-feat-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['class/class-artificer.json','class/class-barbarian.json','class/class-bard.json','class/class-cleric.json','class/class-druid.json','class/class-fighter.json','class/class-monk.json','class/class-paladin.json','class/class-ranger.json','class/class-rogue.json','class/class-sorcerer.json','class/class-warlock.json','class/class-wizard.json','feats.json','variantrules.json','items-base.json','items.json','magicvariants.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/passive-feat-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/passive-feat-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_reviewed_passive_feats.ts .cache/web-consumer .cache/passive-feat-inputs .cache/reviewed-passive-feats.json
      - name: Replay exact reviewed PHB2014 armor feat workflows
        run: node --experimental-strip-types scripts/audit_reviewed_armor_feats.ts .cache/web-consumer .cache/passive-feat-inputs .cache/reviewed-armor-feats.json
      - name: Replay exact reviewed PHB2014 Weapon Master workflow
        run: node --experimental-strip-types scripts/audit_reviewed_weapon_master.ts .cache/web-consumer .cache/passive-feat-inputs .cache/reviewed-weapon-master.json
      - name: Replay three explicit attuned TCE infusion workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/attuned-inputs
          for path in class/class-artificer.json optionalfeatures.json items-base.json; do
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 3000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/e2623b204ddbdf2bcfa8317acfc962de89c676e2/data/$path" \
              --output ".cache/attuned-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['class/class-artificer.json','optionalfeatures.json','items-base.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/attuned-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/attuned-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_attuned_infusions.ts .cache/web-consumer .cache/attuned-inputs .cache/attuned-workflow.json
      - name: Replay exact TCE infusion charge and dawn recovery workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/infusion-charge-inputs
          for path in class/class-artificer.json optionalfeatures.json items.json items-base.json; do
            revision=e2623b204ddbdf2bcfa8317acfc962de89c676e2
            if [ "$path" = items.json ]; then revision=5cc0bbe2c2b241a334e731af4448bdba2168e8bd; fi
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 15000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/$path" \
              --output ".cache/infusion-charge-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['class/class-artificer.json','optionalfeatures.json','items.json','items-base.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/infusion-charge-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/infusion-charge-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_infusion_charges.ts .cache/web-consumer .cache/infusion-charge-inputs .cache/infusion-charges.json
      - name: Replay exact Radiant Weapon and Spell-Refueling Ring workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/radiant-refueling-inputs
          for path in class/class-artificer.json class/class-warlock.json optionalfeatures.json items.json items-base.json spells/spells-phb.json; do
            revision=e2623b204ddbdf2bcfa8317acfc962de89c676e2
            if [ "$path" = items.json ]; then revision=5cc0bbe2c2b241a334e731af4448bdba2168e8bd; fi
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 15000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/$revision/data/$path" \
              --output ".cache/radiant-refueling-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['class/class-artificer.json','class/class-warlock.json','optionalfeatures.json','items.json','items-base.json','spells/spells-phb.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/radiant-refueling-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/radiant-refueling-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_radiant_refueling.ts .cache/web-consumer .cache/radiant-refueling-inputs .cache/radiant-refueling.json
      - name: Replay three reviewed PHB invocation spell workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/invocation-inputs
          for path in optionalfeatures.json class/class-warlock.json spells/spells-phb.json; do
            curl --disable --fail --silent --show-error --max-time 60 --max-filesize 3000000 --proto '=https' \
              "https://raw.githubusercontent.com/tjliqy/5etools-cn/e2623b204ddbdf2bcfa8317acfc962de89c676e2/data/$path" \
              --output ".cache/invocation-inputs/$(basename "$path")"
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const paths=['optionalfeatures.json','class/class-warlock.json','spells/spells-phb.json'];
          const rows=paths.map(path=>{const filename=path.split('/').at(-1),body=JSON.parse(readFileSync('.cache/invocation-inputs/'+filename,'utf8'));return {url:'https://5e.kiwee.top/data/'+path,path:filename,sha256:createHash('sha256').update(JSON.stringify(body)).digest('hex')};});
          writeFileSync('.cache/invocation-inputs/index.json',JSON.stringify({rows}));
          NODE
          node --experimental-strip-types scripts/audit_invocation_spells.ts .cache/web-consumer .cache/invocation-inputs .cache/invocation-spells.json
      - name: Replay three reviewed level-9 PHB invocation workflows
        run: node --experimental-strip-types scripts/audit_invocation_level9.ts .cache/web-consumer .cache/invocation-inputs .cache/invocation-level9.json
      - name: Replay seven reviewed PHB invocation dual-payment workflows
        run: node --experimental-strip-types scripts/audit_invocation_dual_payment.ts .cache/web-consumer .cache/invocation-inputs .cache/invocation-dual-payment.json
      - name: Replay three reviewed remaining PHB at-will invocation workflows
        run: node --experimental-strip-types scripts/audit_invocation_atwill.ts .cache/web-consumer .cache/invocation-inputs .cache/invocation-atwill.json
      - name: Replay exact PHB Beguiling Influence qualification and skill preservation
        run: node --experimental-strip-types scripts/audit_invocation_skill_guard.ts .cache/web-consumer .cache/invocation-inputs .cache/invocation-skill-guard.json
      - run: npm test
      - run: npm run build
  preserved-ui8-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read preserved mainline evidence binding
        id: lineage
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('reports/progress/data-chain-integration-20261025.json','utf8'));
          for(const [key,value] of Object.entries({data:r.priorMain.revision,consumer:r.priorMain.consumerRevision})){
            if(!/^[a-f0-9]{40}$/.test(value))throw Error('Invalid preserved revision');
            appendFileSync(process.env.GITHUB_OUTPUT,key+'='+value+'\n');
          }
          NODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.lineage.outputs.data }}
          path: .cache/ui8-data
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: FullPeople/DND-card-web
          ref: ${{ steps.lineage.outputs.consumer }}
          path: .cache/ui8-consumer
          persist-credentials: false
      - name: Verify both report hashes and preserved UI8 proof
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const r=JSON.parse(readFileSync('reports/progress/data-chain-integration-20261025.json','utf8'));
          const check=(path,expected)=>{const hash=createHash('sha256').update(readFileSync(path)).digest('hex');if(hash!==expected)throw Error('Evidence hash mismatch: '+path);};
          check(r.acceptedTip.reportPath,r.acceptedTip.reportSha256);
          check('.cache/ui8-data/'+r.priorMain.reportPath,r.priorMain.reportSha256);
          check('.cache/ui8-data/'+r.priorMain.proofPath,r.priorMain.proofSha256);
          check(r.priorMain.proofPath,r.priorMain.proofSha256);
          NODE
      - name: Verify all 169 historical UI8 module gates at their original consumer
        run: node --experimental-strip-types scripts/verify_runtime_consumer.ts .cache/ui8-consumer .cache/ui8-data/reports/progress/runtime-coverage.json
  pipeline:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch, derive, apply reviewed overlays, validate and report
        run: npm run pipeline
      - run: npm run validate -- --file artifacts/automation.json
      - uses: actions/upload-artifact@v4
        with:
          name: automation-ir-${{ github.sha }}
          path: |
            artifacts/automation.json
            artifacts/coverage-report.json
            artifacts/coverage-report.md
            artifacts/unsupported.json
            artifacts/diff-report.md
            artifacts/inputs-sha256.json
          if-no-files-found: error
